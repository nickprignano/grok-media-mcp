name: Release

# Pushing a tag like v0.2.0 builds the local-mode package and attaches it to a GitHub release
# with its SHA-256, so people install a fixed file instead of whatever a registry serves.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build:local
      - run: npm run test:local
      - run: npm pack --ignore-scripts
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          file=$(ls grok-media-mcp-*.tgz)
          sum=$(sha256sum "$file" | cut -d' ' -f1)
          printf 'Local mode package.\n\nSHA-256 of %s: `%s`\n\nInstall: see the README, "Run it on your own computer".\n' "$file" "$sum" > notes.md
          gh release create "$GITHUB_REF_NAME" "$file" --title "$GITHUB_REF_NAME" --notes-file notes.md
